<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediClick</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<header>

    <h1>MediClick</h1>

    <nav>

        <ul>

            <li><a href="#">Inicio</a></li>

            <li><a href="#">Directorio Médico</a></li>

            <li><a href="#">Mis Reservas</a></li>

            <li><a href="#">Contacto</a></li>

            <li><a href="#">Iniciar Sesión</a></li>

        </ul>

    </nav>

</header>

<main>

    <section>

        <article>

            <h2>Tu salud, nuestra prioridad</h2>

            <p>
                Agenda tus citas médicas de forma rápida y sencilla.
            </p>

        </article>

        <aside>

            <img
                src="img/doctor.png"
                alt="Imagen de un medico">

        </aside>

    </section>
    <section>

    <h2>Buscar cita</h2>

    <form>

        <label for="especialidad">
            Especialidad
        </label>

        <input
            type="text"
            id="especialidad"
            placeholder="Especialidad">

        <br><br>

        <label for="ubicacion">
            Ubicación
        </label>

        <input
            type="text"
            id="ubicacion"
            placeholder="Ciudad">

        <br><br>

        <button type="submit">
            Buscar
        </button>

    </form>

    </section>

</main>

</body>

</html>

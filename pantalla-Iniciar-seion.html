<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediClick - Iniciar Sesión</title>
</head>
<body>

    
    <header>
        <h1>MediClick</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="reservas.html">Reservas</a></li>
                <li><a href="mi-perfil-elian.html">Mi Perfil</a></li>
                <li><a href="directorio.html">Directorio Médico</a></li>
                <li><a href="contacto.html">Contacto / Ayuda</a></li>
                <li><a href="iniciar-sesion.html" aria-current="page">Iniciar Sesión</a></li>
            </ul>
        </nav>
    </header>

    
    <main>
        <section aria-labelledby="titulo-login">
            <h2 id="titulo-login">Iniciar Sesión</h2>
            
            <figure>
                
                <img src="../img/icono-usuario.png" alt="Icono de usuario para iniciar sesión">
            </figure>

            <form action="#" method="post">
                <div>
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <div>
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit">Entrar</button>
            </form>

            <aside aria-label="Enlaces adicionales de acceso">
                <p><a href="recuperar.html">¿Olvidaste tu contraseña?</a></p>
                <p>¿Eres nuevo? <a href="registro.html">Regístrate Aquí</a></p>
            </aside>
        </section>
    </main>

    
    <footer>
        <p>&copy; 2026 MediClick - Todos los derechos reservados.</p>
    </footer>

</body>
</html>

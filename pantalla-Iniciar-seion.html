<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediClick - Iniciar Sesión</title>

    <link rel="stylesheet" href="iniciar-sesion.css">
</head>

<body>

    <header class="header">

        <h1 class="logo">MEDICLICK</h1>

        <nav class="menu" aria-label="Navegación principal">

            <a href="../index.html">Inicio</a>
            <a href="../reservas.html">Reservas</a>
            <a href="mi-perfil-elian.html">Mi Perfil</a>
            <a href="#">Directorio Médico</a>
            <a href="#">Contacto / Ayuda</a>

            <a class="login-activo" href="#" aria-current="page">
                👤 Iniciar Sesión
            </a>

        </nav>

    </header>


    <main class="contenido-login">

        <section class="tarjeta-login" aria-labelledby="titulo-login">

            <figure class="perfil-login">

                <img
                    src="../img/icono-usuario.png"
                    alt="Icono de usuario para iniciar sesión"
                >

            </figure>


            <h2 id="titulo-login">
                Iniciar Sesión
            </h2>


            <form class="formulario-login" action="#" method="post">

                <div class="campo">

                    <label for="correo">
                        ✉ Correo Electrónico
                    </label>

                    <input
                        type="email"
                        id="correo"
                        name="correo"
                        placeholder="Correo Electrónico"
                        required
                    >

                </div>


                <div class="campo">

                    <label for="password">
                        🔒 Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Contraseña"
                        required
                    >

                </div>


                <button class="boton-entrar" type="submit">
                    ENTRAR
                </button>

            </form>


            <aside class="opciones-login">

                <p>
                    <a href="#">
                        ¿Olvidaste tu contraseña?
                    </a>
                </p>

                <p>
                    ¿Eres nuevo?
                    <a href="registro.html">
                        Regístrate Aquí
                    </a>
                </p>

            </aside>

        </section>

    </main>

</body>

</html>

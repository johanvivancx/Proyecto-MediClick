<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | MediClick</title>
    <link rel="stylesheet" href="../iniciar-sesion.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <h1>MediClick</h1>
        </div>
        <nav class="main-nav" aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="directoriomedico.html">Directorio Médico</a></li>
                <li><a href="reservas.html">Reservas</a></li>
                <li><a href="mis_reservas.html">Mis Reservas</a></li>
                <li><a href="pantalla-reserva-contacto.html">Contacto</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="pantalla-Iniciar-seion.html" class="btn-login">Iniciar Sesión</a>
                <a href="registro.html" class="btn-register">Registrarse</a>
            </div>
        </nav>
    </header>

    <main class="contenido-login">
        <div class="login-wrapper">
            <section class="tarjeta-login">
                <figure class="perfil-login">
                    <img src="../img/iniciar-sesion.png" alt="" aria-hidden="true">
                </figure>
                <h2>Recuperar Contraseña</h2>
                <p class="login-subtitle" style="margin-bottom: 25px;">Ingresa tu correo electrónico y te enviaremos un enlace seguro para restablecer tu contraseña.</p>
                
                <form class="formulario-login" action="pantalla-Iniciar-seion.html" method="get">
                    <div class="campo">
                        <label for="correo-recuperacion">Correo Electrónico</label>
                        <input type="email" id="correo-recuperacion" name="correo-recuperacion" placeholder="ejemplo@correo.com" required>
                    </div>
                    <button class="boton-entrar" type="submit">Enviar Enlace</button>
                </form>
                
                <aside class="opciones-login">
                    <p><a href="pantalla-Iniciar-seion.html">← Volver a Iniciar Sesión</a></p>
                </aside>
            </section>
        </div>
    </main>
    <script src="../main.js"></script>
</body>
</html>

    <main>
        
        <section aria-labelledby="titulo-perfil">
            <h2 id="titulo-perfil">Actualiza tu Información Personal</h2>

            
            <figure>
                <img src="../img/perfil-usuario.png" alt="Foto de perfil del usuario Elian">
                <figcaption>Cambiar foto de perfil</figcaption>
            </figure>

            
            <form action="#" method="post">
                <div>
                    <label for="nombres">Nombres:</label>
                    <input type="text" id="nombres" name="nombres" placeholder="Ingrese dos nombres" required>
                </div>

                <div>
                    <label for="apellidos">Apellidos:</label>
                    <input type="text" id="apellidos" name="apellidos" placeholder="Ingrese dos apellidos" required>
                </div>

                <div>
                    <label for="cedula">Cédula / Identificación:</label>
                    <input type="text" id="cedula" name="cedula" placeholder="Ingresa tu número de identificación" required>
                </div>

                <div>
                    <label for="correo">Correo Electrónico:</label>
                    <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
                </div>

                <button type="submit">Guardar Cambios</button>
            </form>
        </section>
    </main>

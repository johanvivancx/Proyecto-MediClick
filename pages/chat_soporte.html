<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Soporte | MediClick</title>
    <link rel="stylesheet" href="../css_contacto_ayuda.css">
    <style>
        .chat-box { max-width: 600px; width: 90%; margin: 20px auto; background: white; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: flex; flex-direction: column; overflow: hidden; }
        .chat-header { background: #0088ff; color: white; padding: 15px 20px; font-weight: bold; display: flex; align-items: center; gap: 10px; }
        .chat-body { padding: 20px; height: 300px; overflow-y: auto; background: #f8f9fa; display: flex; flex-direction: column; gap: 12px; }
        .mensaje { padding: 10px 15px; border-radius: 8px; max-width: 80%; font-size: 14px; }
        .bot { background: #eaf3ff; color: #2c3e50; align-self: flex-start; }
        .usuario { background: #0088ff; color: white; align-self: flex-end; }
        .chat-footer { display: flex; padding: 15px; background: white; border-top: 1px solid #e2e8f0; gap: 10px; }
        .chat-footer input { flex: 1; padding: 10px 15px; border: 1px solid #cbd5e0; border-radius: 6px; outline: none; }
        .chat-footer button { background: #0088ff; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <h1>MediClick</h1>
        </div>
        <nav class="main-nav" aria-label="Navegación principal">
            <ul>
                <li><a href="../index.html">Inicio</a></li>
                <li><a href="directoriomedico.html">Directorio Médico</a></li>
                <li><a href="reservas.html">Reservas</a></li>
                <li><a href="mis_reservas.html">Mis Reservas</a></li>
                <li><a href="pantalla-reserva-contacto.html" class="active" aria-current="page">Contacto</a></li>
            </ul>
            <div class="auth-buttons">
                <a href="pantalla-Iniciar-seion.html" class="btn-login">Iniciar Sesión</a>
                <a href="registro.html" class="btn-register">Registrarse</a>
            </div>
        </nav>
    </header>

    <div class="sub-header" style="max-width: 1200px; width: 95%; margin: 25px auto 0 auto; display: flex; align-items: center; gap: 15px;">
        <a href="pantalla-reserva-contacto.html" class="btn-back" style="color: #0056b3; text-decoration: none; font-weight: bold; font-size: 15px;">← Volver a Contacto</a>
        <h2>Chat en Línea</h2>
    </div>

    <main style="flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div class="chat-box">
            <div class="chat-header">
                <img src="../img/chatbot.png" alt="" style="width: 30px; height: 30px; background: white; border-radius: 50%;">
                <span>Asistente Virtual MediClick</span>
            </div>
            <div class="chat-body" id="chatBody">
                <div class="mensaje bot">¡Hola! Soy el bot de soporte de MediClick. ¿En qué puedo ayudarte hoy con tus citas médicas?</div>
            </div>
            <div class="chat-footer">
                <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." autofocus>
                <button id="sendBtn">Enviar</button>
            </div>
        </div>
    </main>

    <script>
        const body = document.getElementById("chatBody");
        const input = document.getElementById("userInput");
        const btn = document.getElementById("sendBtn");

        function agregarMensaje(texto, tipo) {
            const div = document.createElement("div");
            div.className = `mensaje ${tipo}`;
            div.textContent = texto;
            body.appendChild(div);
            body.scrollTop = body.scrollHeight;
        }

        btn.addEventListener("click", () => {
            const texto = input.value.trim();
            if(!texto) return;
            agregarMensaje(texto, "usuario");
            input.value = "";
            setTimeout(() => {
                agregarMensaje("Gracias por tu mensaje. Un asesor o nuestro sistema automatizado procesará tu solicitud de inmediato.", "bot");
            }, 1000);
        });

        input.addEventListener("keypress", (e) => {
            if(e.key === "Enter") btn.click();
        });
    </script>
</body>
</html>
